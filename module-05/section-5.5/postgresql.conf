# postgresql.conf — параметры TLS для payment-api окружения
# Включить TLS
ssl = on

# Серверный сертификат (выдан Vault PKI или подписан доверенным CA)
ssl_cert_file = '/etc/ssl/server.crt'
ssl_key_file  = '/etc/ssl/server.key'

# CA из Vault PKI — которым подписаны клиентские SVID
ssl_ca_file   = '/etc/ssl/vault-ca.pem'

# Минимальная версия протокола
ssl_min_protocol_version = 'TLSv1.2'

# Стандартные настройки остаются по умолчанию (postgresql.conf.sample)
