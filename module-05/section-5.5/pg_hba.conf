# pg_hba.conf — обязательный mTLS с проверкой клиентского сертификата
# clientcert=verify-full: сертификат подписан доверенным CA И CN совпадает с pg_ident

# TYPE  DATABASE  USER  ADDRESS     METHOD
hostssl payments   all   0.0.0.0/0   cert clientcert=verify-full map=svid-map

# Локальный суперпользователь — только с хоста PostgreSQL
local   all       postgres            peer
