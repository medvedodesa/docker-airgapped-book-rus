# pg_hba.conf — минимальный пример для mTLS с клиентским сертификатом
# TYPE     DATABASE  USER  ADDRESS      METHOD
# Только SSL-соединения с обязательным клиентским сертификатом:
hostssl    appdb     all   0.0.0.0/0    cert   clientcert=verify-full
# Все прочие соединения (без TLS или без сертификата) — отклонять:
# local и host без SSL не разрешаются
