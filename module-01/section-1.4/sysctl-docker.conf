# Параметры ядра для Docker в изолированной среде
# Скопировать: cp sysctl-docker.conf /etc/sysctl.d/99-docker.conf
# Применить:   sysctl --system

# Разрешить маршрутизацию IPv4 (необходимо для контейнерных сетей)
net.ipv4.ip_forward = 1

# Фильтрация bridge-трафика через iptables
net.bridge.bridge-nf-call-iptables  = 1
net.bridge.bridge-nf-call-ip6tables = 1
net.bridge.bridge-nf-call-arptables = 1

# Увеличенные лимиты inotify для наблюдателей файловой системы
# (необходимо при большом числе контейнеров)
fs.inotify.max_user_watches   = 524288
fs.inotify.max_user_instances = 512

# Лимиты файловых дескрипторов
fs.file-max = 1000000

# Оптимизация сетевого буфера для контейнерного трафика
net.core.somaxconn              = 65535
net.ipv4.tcp_max_syn_backlog    = 65535
net.core.netdev_max_backlog     = 65535

# Защита от IP-спуфинга
net.ipv4.conf.all.rp_filter    = 1
net.ipv4.conf.default.rp_filter = 1

# Отключение ICMP-перенаправлений (безопасность)
net.ipv4.conf.all.accept_redirects    = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv4.conf.all.send_redirects      = 0
